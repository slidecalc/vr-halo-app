<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>大気光学現象 AR</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      color: #fff;
    }
    #viewCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(10, 12, 18, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 20px;
    }
    #startScreen h1 {
      font-size: 20px;
      font-weight: 700;
    }
    #startScreen p {
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.6;
      max-width: 300px;
    }
    #startBtn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 16px 32px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.45);
    }
    #startBtn:active {
      transform: scale(0.97);
    }
    #setLightBtn {
      position: fixed;
      left: 50%;
      bottom: calc(32px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 15;
      display: none;
      background: rgba(255, 255, 255, 0.94);
      color: #0f172a;
      border: none;
      border-radius: 999px;
      padding: 16px 36px;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
      cursor: pointer;
    }
    #setLightBtn:active {
      transform: translateX(-50%) scale(0.96);
    }
    #resetBtn {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      right: 14px;
      z-index: 15;
      display: none;
      background: rgba(15, 23, 42, 0.65);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      backdrop-filter: blur(6px);
      cursor: pointer;
    }
    #reticle {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 64px;
      height: 64px;
      transform: translate(-50%, -50%);
      z-index: 12;
      display: none;
      pointer-events: none;
    }
    #reticle::before, #reticle::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
    }
    #reticle::before {
      left: 50%;
      top: 12px;
      bottom: 12px;
      width: 1.5px;
      transform: translateX(-50%);
    }
    #reticle::after {
      top: 50%;
      left: 12px;
      right: 12px;
      height: 1.5px;
      transform: translateY(-50%);
    }
    #reticleRing {
      width: 100%;
      height: 100%;
      border: 2px solid rgba(255, 230, 120, 0.9);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(255, 220, 100, 0.5);
    }
  </style>
</head>
<body>
  <canvas id="viewCanvas"></canvas>

  <div id="reticle"><div id="reticleRing"></div></div>

  <div id="startScreen">
    <h1>大気光学現象 AR</h1>
    <p>カメラとモーションセンサーを許可し、画面中央に光源を合わせて「光源設定」を押してください。</p>
    <button id="startBtn">カメラとセンサーを起動</button>
  </div>

  <button id="setLightBtn">光源設定</button>
  <button id="resetBtn">再設定</button>

  <video id="hiddenVideo" playsinline autoplay muted style="display:none;"></video>
  <canvas id="procCanvas" width="120" height="120" style="display:none;"></canvas>

  <script>
    const viewCanvas = document.getElementById("viewCanvas");
    const ctx = viewCanvas.getContext("2d");
    const procCanvas = document.getElementById("procCanvas");
    const procCtx = procCanvas.getContext("2d", { willReadFrequently: true });
    const video = document.getElementById("hiddenVideo");

    const startScreen = document.getElementById("startScreen");
    const startBtn = document.getElementById("startBtn");
    const setLightBtn = document.getElementById("setLightBtn");
    const resetBtn = document.getElementById("resetBtn");
    const reticle = document.getElementById("reticle");

    let isLocked = false;
    let sunWorld = null;

    let hasOrientation = false;
    let smoothAlpha = 0, smoothBeta = 90, smoothGamma = 0;
    let smoothGrav = { x: 0, y: -9.8, z: 0 };

    // iPhone SE3 背面広角カメラの垂直画角目安
    const V_FOV_DEG = 63.0;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      viewCanvas.width = window.innerWidth * dpr;
      viewCanvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    function norm(v) {
      const l = Math.hypot(v.x, v.y, v.z) || 1;
      return { x: v.x / l, y: v.y / l, z: v.z / l };
    }
    function dot(a, b) {
      return a.x * b.x + a.y * b.y + a.z * b.z;
    }
    function cross(a, b) {
      return {
        x: a.y * b.z - a.z * b.y,
        y: a.z * b.x - a.x * b.z,
        z: a.x * b.y - a.y * b.x
      };
    }
    function scale(v, s) {
      return { x: v.x * s, y: v.y * s, z: v.z * s };
    }
    function add(a, b) {
      return { x: a.x + b.x, y: a.y + b.y, z: a.z + b.z };
    }

    function lerpAngle(curr, target, factor) {
      let diff = ((target - curr + 540) % 360) - 180;
      // 急激なスパイクノイズを少し抑えつつ追従性を確保
      if (Math.abs(diff) > 45) diff *= 0.5;
      return (curr + diff * factor + 360) % 360;
    }

    function getDeviceToWorldMatrix(alphaDeg, betaDeg, gammaDeg) {
      const deg2rad = Math.PI / 180;
      const a = alphaDeg * deg2rad;
      const b = betaDeg * deg2rad;
      const g = gammaDeg * deg2rad;

      const cA = Math.cos(a), sA = Math.sin(a);
      const cB = Math.cos(b), sB = Math.sin(b);
      const cG = Math.cos(g), sG = Math.sin(g);

      const r11 = cA * cG - sA * sB * sG;
      const r12 = -cB * sA;
      const r13 = cA * sG + cG * sA * sB;

      const r21 = cG * sA + cA * sB * sG;
      const r22 = cA * cB;
      const r23 = sA * sG - cA * cG * sB;

      const r31 = -cB * sG;
      const r32 = sB;
      const r33 = cB * cG;

      return [
        [r11, r12, r13],
        [r21, r22, r23],
        [r31, r32, r33]
      ];
    }

    function deviceToWorld(v, m) {
      return {
        x: m[0][0] * v.x + m[0][1] * v.y + m[0][2] * v.z,
        y: m[1][0] * v.x + m[1][1] * v.y + m[1][2] * v.z,
        z: m[2][0] * v.x + m[2][1] * v.y + m[2][2] * v.z
      };
    }

    function worldToDevice(v, m) {
      return {
        x: m[0][0] * v.x + m[1][0] * v.y + m[2][0] * v.z,
        y: m[0][1] * v.x + m[1][1] * v.y + m[2][1] * v.z,
        z: m[0][2] * v.x + m[1][2] * v.y + m[2][2] * v.z
      };
    }

    function initSensors() {
      window.addEventListener("deviceorientation", (e) => {
        if (e.alpha === null || e.beta === null || e.gamma === null) return;
        const a = (typeof e.webkitCompassHeading === "number")
          ? (360 - e.webkitCompassHeading) % 360
          : e.alpha;
        if (!hasOrientation) {
          smoothAlpha = a;
          smoothBeta = e.beta;
          smoothGamma = e.gamma;
          hasOrientation = true;
        } else {
          // 動かしたときのズレを減らすため追従係数を 0.28 に引き上げ
          smoothAlpha = lerpAngle(smoothAlpha, a, 0.28);
          smoothBeta += (e.beta - smoothBeta) * 0.28;
          smoothGamma += (e.gamma - smoothGamma) * 0.28;
        }
      });

      window.addEventListener("devicemotion", (e) => {
        const g = e.accelerationIncludingGravity;
        if (!g || g.x === null) return;
        smoothGrav.x += (g.x - smoothGrav.x) * 0.25;
        smoothGrav.y += (g.y - smoothGrav.y) * 0.25;
        smoothGrav.z += (g.z - smoothGrav.z) * 0.25;
      });
    }

    startBtn.addEventListener("click", async () => {
      try {
        if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res !== "granted") {
            alert("モーションと向きのアクセスを許可してください。");
            return;
          }
        }
        if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
          await DeviceMotionEvent.requestPermission().catch(() => {});
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { exact: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        }).catch(() => navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: "environment" }
        }));

        const track = stream.getVideoTracks()[0];
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.zoom && typeof caps.zoom.min === "number") {
          await track.applyConstraints({ advanced: [{ zoom: caps.zoom.min }] }).catch(() => {});
        }

        video.srcObject = stream;
        await video.play();

        initSensors();

        startScreen.style.display = "none";
        setLightBtn.style.display = "block";
        reticle.style.display = "block";
        requestAnimationFrame(renderLoop);
      } catch (err) {
        alert("カメラまたはセンサーの起動に失敗しました。SafariでHTTPSページを開いているか確認してください。\n" + err.message);
      }
    });

    function detectBrightestLightRay() {
      const w = procCanvas.width;
      const h = procCanvas.height;
      procCtx.drawImage(video, 0, 0, w, h);
      const data = procCtx.getImageData(0, 0, w, h).data;

      const xMin = Math.floor(w * 0.3);
      const xMax = Math.floor(w * 0.7);
      const yMin = Math.floor(h * 0.3);
      const yMax = Math.floor(h * 0.7);

      let maxLum = 0;
      for (let y = yMin; y < yMax; y++) {
        for (let x = xMin; x < xMax; x++) {
          const i = (y * w + x) * 4;
          const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          if (lum > maxLum) maxLum = lum;
        }

      const threshold = Math.max(maxLum * 0.9, 180);
      let sumX = 0, sumY = 0, sumW = 0;

      for (let y = yMin; y < yMax; y++) {
        for (let x = xMin; x < xMax; x++) {
          const i = (y * w + x) * 4;
          const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          if (lum >= threshold) {
            const weight = (lum - threshold + 1);
            sumX += x * weight;
            sumY += y * weight;
            sumW += weight;

      const cy = sumW > 0 ? sumY / sumW : h / 2;

      const f = (h / 2) / Math.tan(vFovRad / 2);

      const dy = -(cy - h /
