<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>大気光学現象 AR</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      color: #fff;
    }
    #viewCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(10, 12, 18, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 20px;
    }
    #startScreen h1 {
      font-size: 20px;
      font-weight: 700;
    }
    #startScreen p {
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.6;
      max-width: 300px;
    }
    #startBtn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 16px 32px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.45);
    }
    #startBtn:active {
      transform: scale(0.97);
    }
    #setLightBtn {
      position: fixed;
      left: 50%;
      bottom: calc(32px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 15;
      display: none;
      background: rgba(255, 255, 255, 0.94);
      color: #0f172a;
      border: none;
      border-radius: 999px;
      padding: 16px 36px;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
      cursor: pointer;
    }
    #setLightBtn:active {
      transform: translateX(-50%) scale(0.96);
    }
    #resetBtn {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      right: 14px;
      z-index: 15;
      display: none;
      background: rgba(15, 23, 42, 0.65);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      backdrop-filter: blur(6px);
      cursor: pointer;
    }
    #reticle {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 64px;
      height: 64px;
      transform: translate(-50%, -50%);
      z-index: 12;
      display: none;
      pointer-events: none;
    }
    #reticle::before, #reticle::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
    }
    #reticle::before {
      left: 50%;
      top: 12px;
      bottom: 12px;
      width: 1.5px;
      transform: translateX(-50%);
    }
    #reticle::after {
      top: 50%;
      left: 12px;
      right: 12px;
      height: 1.5px;
      transform: translateY(-50%);
    }
    #reticleRing {
      width: 100%;
      height: 100%;
      border: 2px solid rgba(255, 230, 120, 0.9);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(255, 220, 100, 0.5);
    }
  </style>
</head>
<body>
  <canvas id="viewCanvas"></canvas>

  <div id="reticle"><div id="reticleRing"></div></div>

  <div id="startScreen">
    <h1>大気光学現象 AR</h1>
    <p>カメラとモーションセンサーを許可し、画面中央に光源を合わせて「光源設定」を押してください。</p>
    <button id="startBtn">カメラとセンサーを起動</button>
  </div>

  <button id="setLightBtn">光源設定</button>
  <button id="resetBtn">再設定</button>

  <video id="hiddenVideo" playsinline autoplay muted style="display:none;"></video>
  <canvas id="procCanvas" width="120" height="120" style="display:none;"></canvas>

  <script>
    const viewCanvas = document.getElementById("viewCanvas");
    const ctx = viewCanvas.getContext("2d");
    const procCanvas = document.getElementById("procCanvas");
    const procCtx = procCanvas.getContext("2d", { willReadFrequently: true });
    const video = document.getElementById("hiddenVideo");

    const startScreen = document.getElementById("startScreen");
    const startBtn = document.getElementById("startBtn");
    const setLightBtn = document.getElementById("setLightBtn");
    const resetBtn = document.getElementById("resetBtn");
    const reticle = document.getElementById("reticle");

    let isLocked = false;
    let sunWorld = null;

    let hasOrientation = false;
    let smoothAlpha = 0, smoothBeta = 90, smoothGamma = 0;
    let smoothGrav = { x: 0, y: -9.8, z: 0 };

    // iPhone SE3 背面広角カメラの垂直画角目安
    const V_FOV_DEG = 63.0;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      viewCanvas.width = window.innerWidth * dpr;
      viewCanvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    function norm(v) {
      const l = Math.hypot(v.x, v.y, v.z) || 1;
      return { x: v.x / l, y: v.y / l, z: v.z / l };
    }
    function dot(a, b) {
      return a.x * b.x + a.y * b.y + a.z * b.z;
    }
    function cross(a, b) {
      return {
        x: a.y * b.z - a.z * b.y,
        y: a.z * b.x - a.x * b.z,
        z: a.x * b.y - a.y * b.x
      };
    }
    function scale(v, s) {
      return { x: v.x * s, y: v.y * s, z: v.z * s };
    }
    function add(a, b) {
      return { x: a.x + b.x, y: a.y + b.y, z: a.z + b.z };
    }

    function lerpAngle(curr, target, factor) {
      let diff = ((target - curr + 540) % 360) - 180;
      // 急激なスパイクノイズを少し抑えつつ追従性を確保
      if (Math.abs(diff) > 45) diff *= 0.5;
      return (curr + diff * factor + 360) % 360;
    }

    function getDeviceToWorldMatrix(alphaDeg, betaDeg, gammaDeg) {
      const deg2rad = Math.PI / 180;
      const a = alphaDeg * deg2rad;
      const b = betaDeg * deg2rad;
      const g = gammaDeg * deg2rad;

      const cA = Math.cos(a), sA = Math.sin(a);
      const cB = Math.cos(b), sB = Math.sin(b);
      const cG = Math.cos(g), sG = Math.sin(g);

      const r11 = cA * cG - sA * sB * sG;
      const r12 = -cB * sA;
      const r13 = cA * sG + cG * sA * sB;

      const r21 = cG * sA + cA * sB * sG;
      const r22 = cA * cB;
      const r23 = sA * sG - cA * cG * sB;

      const r31 = -cB * sG;
      const r32 = sB;
      const r33 = cB * cG;

      return [
        [r11, r12, r13],
        [r21, r22, r23],
        [r31, r32, r33]
      ];
    }

    function deviceToWorld(v, m) {
      return {
        x: m[0][0] * v.x + m[0][1] * v.y + m[0][2] * v.z,
        y: m[1][0] * v.x + m[1][1] * v.y + m[1][2] * v.z,
        z: m[2][0] * v.x + m[2][1] * v.y + m[2][2] * v.z
      };
    }

    function worldToDevice(v, m) {
      return {
        x: m[0][0] * v.x + m[1][0] * v.y + m[2][0] * v.z,
        y: m[0][1] * v.x + m[1][1] * v.y + m[2][1] * v.z,
        z: m[0][2] * v.x + m[1][2] * v.y + m[2][2] * v.z
      };
    }

    function initSensors() {
      window.addEventListener("deviceorientation", (e) => {
        if (e.alpha === null || e.beta === null || e.gamma === null) return;
        const a = (typeof e.webkitCompassHeading === "number")
          ? (360 - e.webkitCompassHeading) % 360
          : e.alpha;
        if (!hasOrientation) {
          smoothAlpha = a;
          smoothBeta = e.beta;
          smoothGamma = e.gamma;
          hasOrientation = true;
        } else {
          // 動かしたときのズレを減らすため追従係数を 0.28 に引き上げ
          smoothAlpha = lerpAngle(smoothAlpha, a, 0.28);
          smoothBeta += (e.beta - smoothBeta) * 0.28;
          smoothGamma += (e.gamma - smoothGamma) * 0.28;
        }
      });

      window.addEventListener("devicemotion", (e) => {
        const g = e.accelerationIncludingGravity;
        if (!g || g.x === null) return;
        smoothGrav.x += (g.x - smoothGrav.x) * 0.25;
        smoothGrav.y += (g.y - smoothGrav.y) * 0.25;
        smoothGrav.z += (g.z - smoothGrav.z) * 0.25;
      });
    }

    startBtn.addEventListener("click", async () => {
      try {
        if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res !== "granted") {
            alert("モーションと向きのアクセスを許可してください。");
            return;
          }
        }
        if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
          await DeviceMotionEvent.requestPermission().catch(() => {});
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { exact: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        }).catch(() => navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: "environment" }
        }));

        const track = stream.getVideoTracks()[0];
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.zoom && typeof caps.zoom.min === "number") {
          await track.applyConstraints({ advanced: [{ zoom: caps.zoom.min }] }).catch(() => {});
        }

        video.srcObject = stream;
        await video.play();

        initSensors();

        startScreen.style.display = "none";
        setLightBtn.style.display = "block";
        reticle.style.display = "block";
        requestAnimationFrame(renderLoop);
      } catch (err) {
        alert("カメラまたはセンサーの起動に失敗しました。SafariでHTTPSページを開いているか確認してください。\n" + err.message);
      }
    });

    function detectBrightestLightRay() {
      const w = procCanvas.width;
      const h = procCanvas.height;
      procCtx.drawImage(video, 0, 0, w, h);
      const data = procCtx.getImageData(0, 0, w, h).data;

      const xMin = Math.floor(w * 0.3);
      const xMax = Math.floor(w * 0.7);
      const yMin = Math.floor(h * 0.3);
      const yMax = Math.floor(h * 0.7);

      let maxLum = 0;
      for (let y = yMin; y < yMax; y++) {
        for (let x = xMin; x < xMax; x++) {
          const i = (y * w + x) * 4;
          const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          if (lum > maxLum) maxLum = lum;
        }
      }

      const threshold = Math.max(maxLum * 0.9, 180);
      let sumX = 0, sumY = 0, sumW = 0;

      for (let y = yMin; y < yMax; y++) {
        for (let x = xMin; x < xMax; x++) {
          const i = (y * w + x) * 4;
          const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          if (lum >= threshold) {
            const weight = (lum - threshold + 1);
            sumX += x * weight;
            sumY += y * weight;
            sumW += weight;
          }
        }
      }

      const cx = sumW > 0 ? sumX / sumW : w / 2;
      const cy = sumW > 0 ? sumY / sumW : h / 2;

      const vFovRad = (V_FOV_DEG * Math.PI) / 180;
      const f = (h / 2) / Math.tan(vFovRad / 2);
      const dx = (cx - w / 2) / f;
      const dy = -(cy - h / 2) / f;
      return norm({ x: dx, y: dy, z: -1 });
    }

    setLightBtn.addEventListener("click", () => {
      const rayDevice = detectBrightestLightRay();
      const m = getDeviceToWorldMatrix(smoothAlpha, smoothBeta, smoothGamma);
      let sun = norm(deviceToWorld(rayDevice, m));

      const gravLen = Math.hypot(smoothGrav.x, smoothGrav.y, smoothGrav.z);
      if (gravLen > 1.0) {
        const upDevice = norm({ x: -smoothGrav.x, y: -smoothGrav.y, z: -smoothGrav.z });
        const sinAlt = Math.max(-1, Math.min(1, dot(rayDevice, upDevice)));
        const horiz = norm({ x: sun.x, y: sun.y, z: 0 });
        const cosAlt = Math.sqrt(Math.max(0, 1 - sinAlt * sinAlt));
        sun = norm({
          x: horiz.x * cosAlt,
          y: horiz.y * cosAlt,
          z: sinAlt
        });
      }

      sunWorld = sun;
      isLocked = true;
      setLightBtn.style.display = "none";
      reticle.style.display = "none";
      resetBtn.style.display = "block";
    });

    resetBtn.addEventListener("click", () => {
      isLocked = false;
      sunWorld = null;
      setLightBtn.style.display = "block";
      reticle.style.display = "block";
      resetBtn.style.display = "none";
    });

    function projectWorldToScreen(dirWorld, m, sw, sh) {
      const d = worldToDevice(dirWorld, m);
      if (d.z >= -0.15) return null;

      const vFovRad = (V_FOV_DEG * Math.PI) / 180;
      const f = (sh / 2) / Math.tan(vFovRad / 2);
      const sx = sw / 2 + (d.x / -d.z) * f;
      const sy = sh / 2 - (d.y / -d.z) * f;

      if (Math.abs(sx - sw / 2) > sw * 3 || Math.abs(sy - sh / 2) > sh * 3) return null;
      return { x: sx, y: sy };
    }

    function drawSphericalArc(centerDir, radiusDeg, startAzDeg, endAzDeg, steps, color, lineWidth, m, sw, sh) {
      const rRad = (radiusDeg * Math.PI) / 180;
      const sinR = Math.sin(rRad);
      const cosR = Math.cos(rRad);

      const ref = Math.abs(centerDir.z) < 0.9 ? { x: 0, y: 0, z: 1 } : { x: 1, y: 0, z: 0 };
      const u = norm(cross(ref, centerDir));
      const v = norm(cross(centerDir, u));

      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.lineCap = "round";

      let penDown = false;
      let prevPt = null;

      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const az = ((startAzDeg + (endAzDeg - startAzDeg) * t) * Math.PI) / 180;
        const pWorld = norm(
          add(
            scale(centerDir, cosR),
            add(scale(u, sinR * Math.cos(az)), scale(v, sinR * Math.sin(az)))
          )
        );

        const pt = projectWorldToScreen(pWorld, m, sw, sh);
        if (!pt) {
          penDown = false;
          prevPt = null;
          continue;
        }

        if (prevPt && Math.hypot(pt.x - prevPt.x, pt.y - prevPt.y) > sw * 0.4) {
          penDown = false;
        }

        if (!penDown) {
          ctx.moveTo(pt.x, pt.y);
          penDown = true;
        } else {
          ctx.lineTo(pt.x, pt.y);
        }
        prevPt = pt;
      }
      ctx.stroke();
    }

    const RAINBOW_COLORS = [
      "rgba(255, 50, 50, 0.72)",
      "rgba(255, 150, 30, 0.72)",
      "rgba(255, 235, 50, 0.72)",
      "rgba(60, 220, 90, 0.72)",
      "rgba(50, 190, 255, 0.72)",
      "rgba(60, 90, 255, 0.72)",
      "rgba(170, 70, 255, 0.72)"
    ];

    function drawRainbowBand(centerDir, baseRadiusDeg, stepDeg, startAz, endAz, steps, width, m, sw, sh) {
      for (let i = 0; i < RAINBOW_COLORS.length; i++) {
        const r = baseRadiusDeg + (i - 3) * stepDeg;
        drawSphericalArc(centerDir, r, startAz, endAz, steps, RAINBOW_COLORS[i], width, m, sw, sh);
      }
    }

    function drawZenithOrientedArc(poleDir, sunAzRad, baseRadiusDeg, spanStartDeg, spanEndDeg, stepDeg, redOutside, m, sw, sh) {
      const u = norm({ x: Math.cos(sunAzRad), y: Math.sin(sunAzRad), z: 0 });
      const v = norm(cross(poleDir, u));

      for (let c = 0; c < RAINBOW_COLORS.length; c++) {
        const offset = redOutside ? (3 - c) * stepDeg : (c - 3) * stepDeg;
        const rRad = ((baseRadiusDeg + offset) * Math.PI) / 180;
        const sinR = Math.sin(rRad);
        const cosR = Math.cos(rRad);

        ctx.beginPath();
        ctx.strokeStyle = RAINBOW_COLORS[c];
        ctx.lineWidth = 2.6;
        ctx.lineCap = "round";

        let penDown = false;
        let prevPt = null;
        const steps = 60;

        for (let i = 0; i <= steps; i++) {
          const az = ((spanStartDeg + (spanEndDeg - spanStartDeg) * (i / steps)) * Math.PI) / 180;
          const pWorld = norm(
            add(
              scale(poleDir, cosR),
              add(scale(u, sinR * Math.cos(az)), scale(v, sinR * Math.sin(az)))
            )
          );
          const pt = projectWorldToScreen(pWorld, m, sw, sh);
          if (!pt) {
            penDown = false;
            prevPt = null;
            continue;
          }
          if (prevPt && Math.hypot(pt.x - prevPt.x, pt.y - prevPt.y) > sw * 0.4) {
            penDown = false;
          }
          if (!penDown) {
            ctx.moveTo(pt.x, pt.y);
            penDown = true;
          } else {
            ctx.lineTo(pt.x, pt.y);
          }
          prevPt = pt;
        }
        ctx.stroke();
      }
    }

    function renderLoop() {
      const sw = window.innerWidth;
      const sh = window.innerHeight;

      if (video.readyState >= 2) {
        const vw = video.videoWidth || sw;
        const vh = video.videoHeight || sh;
        const scaleRatio = Math.max(sw / vw, sh / vh);
        const dw = vw * scaleRatio;
        const dh = vh * scaleRatio;
        ctx.drawImage(video, (sw - dw) / 2, (sh - dh) / 2, dw, dh);
      } else {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, sw, sh);
      }

      if (isLocked && sunWorld) {
        const m = getDeviceToWorldMatrix(smoothAlpha, smoothBeta, smoothGamma);

        const sunPt = projectWorldToScreen(sunWorld, m, sw, sh);
        if (sunPt) {
          ctx.beginPath();
          ctx.arc(sunPt.x, sunPt.y, 10, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255, 250, 210, 0.75)";
          ctx.fill();
        }

        drawSphericalArc(sunWorld, 22.0, 0, 360, 120, "rgba(255, 255, 255, 0.78)", 5, m, sw, sh);

        const antiSolar = { x: -sunWorld.x, y: -sunWorld.y, z: -sunWorld.z };
        drawRainbowBand(antiSolar, 41.2, -0.32, 0, 360, 140, 2.8, m, sw, sh);

        const sunAzRad = Math.atan2(sunWorld.y, sunWorld.x);
        const sunAltDeg = (Math.asin(Math.max(-1, Math.min(1, sunWorld.z))) * 180) / Math.PI;

        const zenith = { x: 0, y: 0, z: 1 };
        const czaRadius = Math.max(8, Math.min(34, 46 - Math.max(0, sunAltDeg)));
        drawZenithOrientedArc(zenith, sunAzRad, czaRadius, -55, 55, 0.35, true, m, sw, sh);

        const nadir = { x: 0, y: 0, z: -1 };
        const chaRadius = Math.max(15, Math.min(65, 90 - Math.max(10, sunAltDeg - 46)));
        drawZenithOrientedArc(nadir, sunAzRad, chaRadius, -50, 50, 0.35, false, m, sw, sh);
      }

      requestAnimationFrame(renderLoop);
    }
  </script>
</body>
</html>
